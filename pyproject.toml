[project]
name = "construction-dependency-engine"
version = "0.1.0"
description = "Open-source prototype: deterministic construction scheduling with dependency graphs, critical path, and delay impact."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn>=0.30"]

[project.optional-dependencies]
# networkx is only used by the tests, as an independent reference implementation.
dev = ["pytest>=8", "httpx2>=2.0", "ruff>=0.6", "networkx>=3.3", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependency_engine"]

[tool.uv]
exclude-newer = "2026-10-17T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
